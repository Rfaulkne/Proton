<script type="module">/**
 * Hall, pulsing: Proton's open lab hall as a floor plan in three zones (a
 * machine shop, a maker space and a robotics lab over half the hall), for a
 * landing screen that nobody touches. Each zone's tile rises and settles on a
 * slow sine, five seconds a loop, a third of a loop behind the zone before it,
 * so a wave runs round the hall. The zone nearest its crest takes the bright

const ZONES = [
  { name: "machines", gx: 0, gy: 0, x0: 3, y0: 3, x1: 83, y1: 63, rest: 6 },
  { name: "maker", gx: 0, gy: 1, x0: 3, y0: 67, x1: 83, y1: 127, rest: 3 },
  { name: "lab", gx: 1, gy: 0.5, x0: 87, y0: 3, x1: 167, y1: 127, rest: 0 },

  foot: rrect(cx - R0, cy - R0, cx + R0, cy + R0, R0, 6), top: rrect(cx - R1, cy - R1, cx + R1, cy + R1, R1, 6),
  inner: rrect(cx - R1 + b, cy - R1 + b, cx + R1 - b, cy + R1 - b, R1 - b, 6),

const ITEMS = [
  [ // the mill: base, column, table and its work, spindle, head; then the lathe: bed, headstock, carriage, tool post, chuck, bar, tailstock
    box(9, 8, 39, 30, 0, 7, 2.5, 1.2), box(9, 11, 19, 25, 7, 42, 2, 1),

    box(5, 40, 67, 52, 0, 10, 2.5, 1.2, [["y", 9, 2.5, 63, 7, 1.5]]), box(5, 38, 21, 54, 10, 27, 2, 1),
    box(31, 39, 41, 53, 10, 14, 1.5, 0.7), box(33, 41, 38, 46, 14, 17.5, 1, 0.4),
    lie("x", 21, 26, 46, 19, 5.5, 1.1), lie("x", 26, 49, 46, 19, 1.8, 0.5), box(49, 41, 59, 51, 10, 23, 2, 1),

    taper(102, 16, 6, 1.8, 13, 24, 0.7), cyl(102, 16, 1.8, 24, 30, 0.5), cyl(102, 16, 2.4, 30, 31.2, 0.6),

    ...[142, 146, 150, 154].map((x) => cyl(x, 16, 1.3, 14, 26, 0.4)), box(139, 12, 157, 20, 13, 19, 1.5, 0.6, [["y", 141, 1.5, 155, 4.5, 1]]),

    lie("y", 52, 60, 124, 33, 3.6, 0.8), cyl(146, 56, 2.6, 0, 6, 0.8),
    box(124, 54, 148, 58, 30, 35, 2, 0.7), cyl(146, 56, 2.4, 22, 30, 0.7),
    box(143, 52.5, 149, 54, 13, 22, 0.6, 0.2), box(143, 58, 149, 59.5, 13, 22, 0.6, 0.2),
    box(92, 78, 110, 120, 0, 12, 2.5, 1.2, [["x", 82, 3, 116, 9, 1.5]]), box(98, 96, 101, 102, 12, 16, 0.8, 0.3),
    box(97, 86, 100, 112, 16, 32, 1.5, 0.6, [["x", 88, 2, 110, 14, 1.2]]), box(103, 92, 107, 106, 12, 13.2, 1, 0.4),
    lie("y", 90, 93, 136, 4, 4, 1), lie("y", 90, 93, 152, 4, 4, 1), box(130, 93, 158, 111, 2, 11, 5, 1.5),
    cyl(144, 102, 3.2, 11, 15, 1), lie("y", 111, 114, 136, 4, 4, 1), lie("y", 111, 114, 152, 4, 4, 1),

hairline({
  name: "hall-pulse",
  means: "Proton's lab hall in three zones, rising and settling in a slow wave: a landing screen that moves without being touched.",
  rules: [5, 7, 8, 9],
  range: [10, 18, 28],
  mount,
});
