<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laborhalle Areas</title>
<style>
  /* The hall on black; each bookable zone is an island that rises and settles in turn. Only transforms and opacity animate. */
  :root { --ground: #000000; --hi: #dfe3ea; --edge: #70737b; --mid: #46464d; --lo: #2b2b31; --active: #2fc4b2; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); display: grid; place-items: center; overflow: hidden; }
  .stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 400 / 225; }
  .stage svg, .layer, .isle { position: absolute; inset: 0; width: 100%; height: 100%; }
  path { fill: var(--ground); stroke: var(--edge); stroke-width: 0.9; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .hi { stroke: var(--hi); } .cr { fill: none; stroke: var(--lo); } .ghost { fill: none; stroke: var(--mid); }
  .axis { fill: none; stroke: var(--lo); stroke-dasharray: 1 4; } .grid { fill: none; stroke: var(--mid); stroke-dasharray: 3 3; }
  .mark { fill: none; stroke: var(--mid); stroke-dasharray: 2 2; } .beam { fill: none; stroke: var(--edge); }
  .socket { fill: none; stroke: var(--mid); stroke-dasharray: 2 3; }
  .zline, .ztick { fill: none; stroke: var(--hi); }
  .leaf { fill: var(--ground); stroke: var(--edge); stroke-width: 0.9; vector-effect: non-scaling-stroke; }
  .dot { fill: var(--hi); stroke: none; } .dot.m { fill: var(--hi); } .dot.off { fill: var(--lo); stroke: none; }
  /* the wave: every island on a sine, a third of a loop apart, so one is always rising as the last settles */
  .isle { will-change: transform; animation: rise 5s cubic-bezier(.37,0,.63,1) infinite; }
  @keyframes rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.94%); } }
  .glow { opacity: .2; will-change: opacity; animation: glow 5s cubic-bezier(.37,0,.63,1) infinite; }
  @keyframes glow { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .layer { will-change: transform; animation: 16s infinite; animation-timing-function: cubic-bezier(.45,0,.55,1); }
  .rx { animation-name: rx; } .ry { animation-name: ry; }
  @keyframes rx { 0% { transform: translate(0, 0); } 20%, 50% { transform: translate(4.21%, 1.75%); } 70%, 100% { transform: translate(0, 0); } }
  @keyframes ry { 0%, 25% { transform: translate(0, 0); } 45%, 75% { transform: translate(-2.16%, 4.12%); } 95%, 100% { transform: translate(0, 0); } }
  /* hover and select: the wave stops, the island under the pointer lifts halfway, a selected one lifts fully and the rest dim */
  .lift { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,0,.2,1); }
  .isle.hov .lift { transform: translateY(-2.17%); }
  .isle.sel .lift { transform: translateY(-3.94%); }
  .isle.hov .glow { opacity: .85; } .isle.sel .glow { opacity: 1; }
  /* the active zone's top fills teal (set --active to the kiosk's own teal) */
  .zfill { fill: var(--active); fill-opacity: 0; stroke: none; transition: fill-opacity .35s; }
  .isle.hov .zfill { fill-opacity: .5; } .isle.sel .zfill { fill-opacity: .9; }
  .stage.has-sel .isle:not(.sel):not(.hov) .glow { opacity: .08; }
  /* labels: the title sits on the rule, the line of contents hangs under it; the chosen one is bright, its rule
     and leader teal */
  .stage { container-type: inline-size; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .leads { z-index: 2; pointer-events: none; }
  .rule { fill: none; stroke: var(--mid); stroke-width: .9; vector-effect: non-scaling-stroke; transition: stroke .35s; }
  .leader { fill: none; stroke: var(--active); stroke-width: .9; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .35s; }
  .tip { fill: var(--active); opacity: 0; transition: opacity .35s; }
  .lead.hov .rule { stroke: var(--edge); }
  .lead.sel .rule { stroke: var(--active); } .lead.sel .leader, .lead.sel .tip { opacity: 1; }
  .tag { position: absolute; z-index: 4; display: block; padding: 0; margin: 0; border: 0; background: none; text-align: left; cursor: pointer;
         color: #9a9ca5; -webkit-tap-highlight-color: transparent; outline: none; white-space: nowrap; }
  .tag { transform: translateY(-3.4cqw); }                       /* the rule runs between the title and the line under it */
  .tag b { display: block; margin-bottom: 1.5cqw; font-weight: 600; font-size: 2.7cqw; line-height: 1; letter-spacing: -0.01em; transition: color .35s; }
  .tag span { display: block; font: 1.25cqw/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em; color: #5f616a; transition: color .35s; }
  .tag.hov b, .tag:focus-visible b { color: #c9ccd3; } .tag.hov span { color: #8a8c95; }
  .tag.sel b { color: #eef0f4; } .tag.sel span { color: #a4a6ae; }
  .stage.has-sel .tag:not(.sel):not(.hov) b { color: #55575f; }
  .hits { z-index: 3; } .hit { fill: transparent; stroke: none; cursor: pointer; pointer-events: all; outline: none; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible { stroke: var(--hi); stroke-width: .9; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  @media (prefers-reduced-motion: reduce) { .isle, .glow, .layer { animation: none; } .glow { opacity: .7; } .lift { transition: none; } }
</style>
</head>

<script>
/* Hover (or focus) an island or its label: the wave stops, the island lifts halfway and fills teal, the label brightens.
   Tap either one: the island lifts fully, its label's rule turns teal and a dashed leader joins them. Tap again or the
   floor to let go. After 30 s without input the wave resumes. A choice is announced as a "zoneselect" event
   on the stage and as postMessage {type: "proton-zone", zone, selected} to a parent frame (zone: lab, machines, maker).
   Put a URL per area in LINKS and a second tap on the chosen one opens it. */
(() => {
  const LINKS = { lab: "", machines: "", maker: "" };
  const stage = document.querySelector(".stage"), parts = {}, isles = [], glows = [];
  document.querySelectorAll(".isle").forEach((el) => { isles.push(el); glows.push(el.querySelector(".glow")); });
  document.querySelectorAll("[data-zone]").forEach((el) => (parts[el.dataset.zone] ||= []).push(el));
  const mark = (z, cls, on) => parts[z].forEach((el) => el.classList.toggle(cls, on));
  let engaged = false, sel = null, hov = null, idle = 0, back = 0;
  const freeze = (el, prop, t) => {                                   // stop the wave where it is, then ease to rest
    const v = getComputedStyle(el)[prop];
    el.style.animation = "none"; el.style[prop] = v; void el.offsetWidth;
    el.style.transition = prop + " " + t; el.style[prop] = "";
  };
  const engage = () => {
    clearTimeout(back); clearTimeout(idle); idle = setTimeout(release, 30000);
    if (engaged) return; engaged = true;
    isles.forEach((el) => freeze(el, "transform", ".5s cubic-bezier(.3,0,.2,1)"));
    glows.forEach((el) => freeze(el, "opacity", ".4s"));
  };
  const resume = () => {                                              // every island is at rest, so the wave restarts from the first
    if (sel || hov) return;
    engaged = false;
    [...isles, ...glows].forEach((el) => { el.style.animation = el.style.transition = el.style.transform = el.style.opacity = ""; });
  };
  const later = (ms) => { clearTimeout(back); back = setTimeout(resume, ms); };
  const announce = (zone, selected) => {
    stage.dispatchEvent(new CustomEvent("zoneselect", { bubbles: true, detail: { zone, selected } }));
    if (window.parent !== window) window.parent.postMessage({ type: "proton-zone", zone, selected }, "*");
  };
  const select = (z) => {
    if (sel) { mark(sel, "sel", false); announce(sel, false); }
    sel = z; stage.classList.toggle("has-sel", !!z);
    if (z) { mark(z, "sel", true); announce(z, true); }
  };
  const hover = (z) => { if (hov) mark(hov, "hov", false); hov = z; if (z) { engage(); mark(z, "hov", true); } else if (!sel) later(1500); };
  function release() { select(null); hover(null); later(600); }
  const tap = (z) => {
    engage();
    if (z === sel) { if (LINKS[z]) { location.href = LINKS[z]; return; } select(null); later(2500); }
    else select(z);
  };
  document.querySelectorAll(".hit, .tag").forEach((h) => {
    const z = h.dataset.zone;
    h.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") hover(z); });
    h.addEventListener("pointerleave", () => { if (hov === z) hover(null); });
    h.addEventListener("focus", () => hover(z));
    h.addEventListener("blur", () => { if (hov === z) hover(null); });
    h.addEventListener("click", (e) => { e.stopPropagation(); tap(z); });
    h.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && h.tagName !== "BUTTON") { e.preventDefault(); tap(z); } if (e.key === "Escape") release(); });
  });
  document.addEventListener("click", () => { if (sel) { select(null); later(1500); } });
})();
</script>
