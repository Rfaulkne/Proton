<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laborhalle Islands 3</title>
<style>
  /* The hall on black; each bookable zone is an island that rises and settles in turn. Only transforms and opacity animate. */
  :root { --ground: #000000; --hi: #dfe3ea; --edge: #70737b; --mid: #46464d; --lo: #2b2b31; --active: #2fc4b2; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); display: grid; place-items: center; overflow: hidden; }
  .stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 400 / 225; }
  .stage svg, .layer, .isle { position: absolute; inset: 0; width: 100%; height: 100%; }
  path { fill: var(--ground); stroke: var(--edge); stroke-width: 0.9; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .hi { stroke: var(--hi); } .cr { fill: none; stroke: var(--lo); } .ghost { fill: none; stroke: var(--mid); }
  .axis { fill: none; stroke: var(--lo); stroke-dasharray: 1 4; } .grid { fill: none; stroke: var(--mid); stroke-dasharray: 3 3; }
  .mark { fill: none; stroke: var(--mid); stroke-dasharray: 2 2; } .beam { fill: none; stroke: var(--edge); }
  .socket { fill: none; stroke: var(--mid); stroke-dasharray: 2 3; }
  .zline, .ztick { fill: none; stroke: var(--hi); }
  .leaf { fill: var(--ground); stroke: var(--edge); stroke-width: 0.9; vector-effect: non-scaling-stroke; }
  .dot { fill: var(--hi); stroke: none; } .dot.m { fill: var(--hi); } .dot.off { fill: var(--lo); stroke: none; }
  /* an island: up, hold, settle, then wait for the wave to come round again */
  .isle { will-change: transform; animation: rise 4.300000000000001s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes rise { 0%, 62%, 100% { transform: translateY(0); } 22%, 36% { transform: translateY(-3.94%); } }
  .glow { opacity: .2; will-change: opacity; animation: glow 4.300000000000001s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes glow { 0%, 62%, 100% { opacity: .2; } 22%, 36% { opacity: 1; } }
  .layer { will-change: transform; animation: 16s infinite; animation-timing-function: cubic-bezier(.45,0,.55,1); }
  .rx { animation-name: rx; } .ry { animation-name: ry; }
  @keyframes rx { 0% { transform: translate(0, 0); } 20%, 50% { transform: translate(4.21%, 1.75%); } 70%, 100% { transform: translate(0, 0); } }
  @keyframes ry { 0%, 25% { transform: translate(0, 0); } 45%, 75% { transform: translate(-2.16%, 4.12%); } 95%, 100% { transform: translate(0, 0); } }
  /* hover and select: the wave stops, the island under the pointer lifts halfway, a selected one lifts fully and the rest dim */
  .lift { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,0,.2,1); }
  .isle.hov .lift { transform: translateY(-2.17%); }
  .isle.sel .lift { transform: translateY(-3.94%); }
  .isle.hov .glow { opacity: .85; } .isle.sel .glow { opacity: 1; }
  /* the active zone's top fills teal (set --active to the kiosk's own teal) */
  .zfill { fill: var(--active); fill-opacity: 0; stroke: none; transition: fill-opacity .35s; }
  .isle.hov .zfill { fill-opacity: .5; } .isle.sel .zfill { fill-opacity: .9; }
  .stage.has-sel .isle:not(.sel):not(.hov) .glow { opacity: .08; }
  .hits { z-index: 2; } .hit { fill: transparent; stroke: none; cursor: pointer; pointer-events: all; outline: none; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible { stroke: var(--hi); stroke-width: .9; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  @media (prefers-reduced-motion: reduce) { .isle, .glow, .layer { animation: none; } .glow { opacity: .7; } .lift { transition: none; } }
</style>

<script>
/* Hover lifts an island, tap/click selects it (stays up, others dim). Tap it again (or the floor) to release.
   After 30 s without input the wave resumes. Selection is announced as a "zoneselect" event on the stage
   and as a postMessage {type: "proton-zone", zone, selected} to a parent frame, so the kiosk can react.
   Optional: put a URL per zone in LINKS and a second tap on the selected island opens it. */
(() => {
  const LINKS = { A: "", B: "", C: "" , D: "" };
  const stage = document.querySelector(".stage"), isles = {}, glows = [];
  document.querySelectorAll(".isle").forEach((el) => { isles[el.dataset.zone] = el; glows.push(el.querySelector(".glow")); });
  let engaged = false, sel = null, idle = 0, back = 0;
  const freeze = (el, prop, t) => {                                   // stop the wave where it is, then ease to rest
    const v = getComputedStyle(el)[prop];
    el.style.animation = "none"; el.style[prop] = v; void el.offsetWidth;
    el.style.transition = prop + " " + t; el.style[prop] = "";
  };
  const engage = () => {
    clearTimeout(back); clearTimeout(idle); idle = setTimeout(release, 30000);
    if (engaged) return; engaged = true;
    Object.values(isles).forEach((el) => freeze(el, "transform", ".5s cubic-bezier(.3,0,.2,1)"));
    glows.forEach((el) => freeze(el, "opacity", ".4s"));
  };
  const resume = () => {                                              // every island is at rest now, so the wave restarts cleanly
    if (sel || stage.querySelector(".isle.hov")) return;
    engaged = false;
    [...Object.values(isles), ...glows].forEach((el) => { el.style.animation = el.style.transition = el.style.transform = el.style.opacity = ""; });
  };
  const announce = (zone, selected) => {
    stage.dispatchEvent(new CustomEvent("zoneselect", { bubbles: true, detail: { zone, selected } }));
    if (window.parent !== window) window.parent.postMessage({ type: "proton-zone", zone, selected }, "*");
  };
  const select = (z) => {
    if (sel) { isles[sel].classList.remove("sel"); announce(sel, false); }
    sel = z; stage.classList.toggle("has-sel", !!z);
    if (z) { isles[z].classList.add("sel"); announce(z, true); }
  };
  function release() { select(null); Object.values(isles).forEach((el) => el.classList.remove("hov")); back = setTimeout(resume, 600); }
  const tap = (z) => {
    engage();
    if (z && z === sel) { if (LINKS[z]) { location.href = LINKS[z]; return; } select(null); back = setTimeout(resume, 2500); }
    else select(z);
  };
  document.querySelectorAll(".hit").forEach((h) => {
    const z = h.dataset.zone;
    h.addEventListener("pointerenter", (e) => { if (e.pointerType === "touch") return; engage(); isles[z].classList.add("hov"); });
    h.addEventListener("pointerleave", () => { isles[z].classList.remove("hov"); if (!sel) back = setTimeout(resume, 1500); });
    h.addEventListener("focus", () => { engage(); isles[z].classList.add("hov"); });
    h.addEventListener("blur", () => { isles[z].classList.remove("hov"); if (!sel) back = setTimeout(resume, 1500); });
    h.addEventListener("click", (e) => { e.stopPropagation(); tap(z); });
    h.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(z); } if (e.key === "Escape") release(); });
  });
  document.addEventListener("click", () => { if (sel) { select(null); back = setTimeout(resume, 1500); } });
})();
</script>
